<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign-in complete · WeekBloom</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f8; color: #1d1d1f; }
  main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1rem; line-height: 1.5; color: #4a4a4f; }
  a.button { display: inline-block; padding: .75rem 1.25rem; border-radius: .6rem; background: #1d1d1f; color: #fff; text-decoration: none; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f2f2f7; } p { color: #aeaeb2; } a.button { background: #f2f2f7; color: #1c1c1e; } }
</style>
</head>
<body>
<main>
  <h1>Sign-in complete</h1>
  <p>Returning you to WeekBloom. If nothing happens, tap the button.</p>
  <a class="button" id="open" href="#">Open WeekBloom</a>
</main>
<script>
  // Launch the app directly by package. This works even when Android has not verified the https link.
  var target = 'intent://thomaskim09.github.io/weekbloom/login-callback' + location.search + '#Intent;scheme=https;package=com.thomaskim.weekbloom;end';
  document.getElementById('open').href = target;
  if (location.search) location.replace(target);
</script>
</body>
</html>
